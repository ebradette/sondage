<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test de connexion Apps Script</title>
<style>
  body { font-family: monospace; background: #111; color: #eee; padding: 30px; }
  h1 { color: #c9a961; }
  button { background: #c9a961; color: #111; border: none; padding: 12px 24px; font-size: 14px; cursor: pointer; margin: 10px 0; }
  pre { background: #222; padding: 16px; border: 1px solid #444; border-radius: 4px; white-space: pre-wrap; word-break: break-all; }
  .ok { color: #6fa86f; }
  .err { color: #e07d79; }
  input { width: 100%; padding: 10px; background: #222; color: #eee; border: 1px solid #444; }
</style>
</head>
<body>
<h1>🧪 Test Apps Script</h1>
<p>URL à tester :</p>
<input id="url" value="https://script.google.com/macros/s/AKfycbx3-6YV33JpWpRA3eaap01sAPeC4vEWhLUnvJyaCZJRoBGmFHoJDys_z15X5CCZCybOKw/exec">
<button onclick="testPing()">Test 1 : Ping</button>
<button onclick="testConfig()">Test 2 : Get Config</button>
<button onclick="testResults()">Test 3 : Results</button>
<pre id="output">Cliquez sur un bouton pour tester...</pre>

<script>
async function call(action) {
  const url = document.getElementById('url').value.trim();
  const out = document.getElementById('output');
  const fullUrl = url + '?action=' + action;
  out.textContent = 'Appel: ' + fullUrl + '\n\n⏳ En attente...';

  try {
    const start = Date.now();
    const resp = await fetch(fullUrl);
    const elapsed = Date.now() - start;
    const text = await resp.text();
    out.innerHTML = '<span class="ok">✓ Réponse en ' + elapsed + 'ms (HTTP ' + resp.status + ')</span>\n\n' + text;
  } catch (err) {
    out.innerHTML = '<span class="err">❌ ERREUR : ' + err.message + '</span>\n\nStack: ' + err.stack;
  }
}

function testPing() { call('ping'); }
function testConfig() { call('getConfig'); }
function testResults() { call('results'); }
</script>
</body>
</html>
